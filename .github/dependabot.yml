version: 2

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/XNAnimation"
      - "/XNAnimationPipeline"
      - "/XNAnimationSample"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      monogame:
        patterns:
          - "MonoGame.*"
    labels:
      - "dependencies"
      - "monogame"
    open-pull-requests-limit: 2
